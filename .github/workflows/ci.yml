name: CI - Radar de Clientes
on:
  pull_request:
  push:
    branches:
      - feat/treg-icp-inteligencia
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
